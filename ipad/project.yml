name: AVAOS
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  AVAOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: ../src
        includes:
          - engine.cpp
          - engine.h
          - analysis.cpp
          - analysis.h
          - dsp.h
          - rfft.h
          - ringbuf.h
    dependencies:
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nyc.soundtemple.ava
        PRODUCT_NAME: "AVA OS"
        DEVELOPMENT_TEAM: JSWF5RVAU3
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../src"
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AVA OS
        NSMicrophoneUsageDescription: AVA OS listens to the music in the room to drive the vibroacoustic zones. The microphone is never recorded.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait]
